<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Projecten | Sofia — Software Engineering</title>

    <meta
      name="description"
      content="Softwareprojecten van Sofia met gebruikte technieken en technische details."
    />

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <script src="assets/js/projects.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Ga naar hoofdinhoud</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-logo" href="index.html">
          Sofia<span class="site-logo__dot" aria-hidden="true">.</span>
        </a>

        <nav aria-label="Hoofdnavigatie">
          <ul class="nav-list">
            <li>
              <a href="index.html">Home</a>
            </li>

            <li>
              <a href="projects.html" aria-current="page">Projecten</a>
            </li>

            <li>
              <a href="blog.html">Blog</a>
            </li>

            <li>
              <a href="contact.html">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section
        class="section projects-page"
        aria-labelledby="projects-title"
      >
        <div class="container">
          <header class="projects-page__header">
            <h1 id="projects-title">Projecten</h1>

            <p class="lead">
              Hier laat ik softwareprojecten zien waar ik tijdens mijn opleiding
              aan werk, met gebruikte technieken en technische details.
            </p>
          </header>

          <div class="projects-controls">
            <div class="projects-search">
              <label for="project-search">Zoek project</label>

              <input
                class="form__input"
                type="search"
                id="project-search"
                placeholder="Bijvoorbeeld JavaScript"
                autocomplete="off"
                aria-controls="projects-list"
              />
            </div>
          </div>

          <p
            id="projects-status"
            class="note projects-status"
            role="status"
          ></p>

          <ul
            id="projects-list"
            class="card-grid"
            aria-label="Softwareprojecten"
          ></ul>

          <noscript>
            <p class="note">
              JavaScript is nodig om de projecten te tonen.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p class="site-footer__text">Sofia — Software Engineering</p>
      </div>
    </footer>
  </body>
</html>
